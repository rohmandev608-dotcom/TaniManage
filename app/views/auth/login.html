<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk — TaniManage</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="auth-card">
      <a class="brand" href="/">🌱 TaniManage</a>
      <h1>Masuk</h1>
      <p>Masuk ke akun TaniManage Anda.</p>
      <p class="error" role="alert">{{error}}</p>
      <form method="post" action="/login">
        <input type="hidden" name="_csrf" value="{{csrfToken}}">
        <label>Email
          <input type="email" name="email" value="{{email}}" required maxlength="254" autocomplete="email">
        </label>
        <label>Password
          <input type="password" name="password" required maxlength="128" autocomplete="current-password">
        </label>
        <button type="submit">Masuk</button>
      </form>
      <p>Belum punya akun? <a href="/register">Daftar</a></p>
    </main>
  </body>
</html>
