<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-8 sticky top-0 z-30 shadow-sm">
    <button id="menuToggle" class="md:hidden text-slate-700 hover:text-emerald-600 focus:outline-none" aria-label="Buka menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>
    <h1 class="font-bold text-base sm:text-lg text-slate-800">{{pageTitle}}</h1>
    <div class="flex items-center space-x-4">
        <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-3 py-1 rounded-full">
            🟢 Status: Aktif
        </span>
        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-sm" aria-label="Notifikasi">
            🔔
        </div>
    </div>
</header>
