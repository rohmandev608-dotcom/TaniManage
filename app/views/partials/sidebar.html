<!-- Sidebar desktop dan drawer mobile -->
<aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col justify-between border-r border-slate-800">
    <div>
        <div class="h-16 flex items-center px-6 bg-slate-950 space-x-3 border-b border-slate-800">
            <span class="text-2xl">🌱</span>
            <span class="font-bold text-lg text-white tracking-wide">TaniManage</span>
        </div>

        <nav class="p-4 space-y-1.5 text-sm font-medium">
            <a href="/farmer" class="{{dashboardNavClass}}">
                <span class="text-lg">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="/farmer/lands" class="{{landNavClass}}">
                <span class="text-lg">🌾</span>
                <span>Data Lahan</span>
            </a>
            <a href="/farmer/crop-cycles" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition {{cropCycleNavClass}}">
                <span class="text-lg">📅</span>
                <span>Musim Tanam</span>
            </a>
            <a href="/farmer/workers" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition {{workerNavClass}}">
                <span class="text-lg">👩‍🌾</span>
                <span>Manajemen Buruh</span>
            </a>
            <a href="/farmer/activities" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition {{activityNavClass}}">
                <span class="text-lg">📝</span>
                <span>Aktivitas Harian</span>
            </a>
            <a href="/farmer/inventory" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition {{inventoryNavClass}}">
                <span class="text-lg">📦</span>
                <span>Stok Inventaris</span>
            </a>
            <a href="/farmer/finance" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition {{financeNavClass}}">
                <span class="text-lg">💰</span>
                <span>Keuangan</span>
            </a>
        </nav>
    </div>

    <div class="p-4 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-emerald-700 text-white font-bold flex items-center justify-center">🌱</div>
            <div>
                <p class="text-sm font-bold text-white leading-tight">{{name}}</p>
                <p class="text-xs text-emerald-400">Petani / Owner</p>
            </div>
        </div>
        <form method="post" action="/logout">
            <input type="hidden" name="_csrf" value="{{csrfToken}}">
            <button type="submit" class="text-slate-400 hover:text-red-400 transition" title="Keluar">
                🚪
            </button>
        </form>
    </div>
</aside>

<div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>
