<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{pageTitle}} - TaniManage FMIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div class="min-h-screen flex flex-col md:flex-row">
        {{>sidebar}}
        <div class="flex-1 flex flex-col md:ml-64">
            {{>navbar}}
            <main class="p-4 sm:p-8 space-y-6 flex-1">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-900">Lahan Saya</h2>
                        <p class="text-sm text-slate-500">Kelola informasi petak lahan pertanian Anda.</p>
                    </div>
                    <a href="/farmer/lands/new" class="inline-flex items-center justify-center px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-md">
                        + Tambah Lahan
                    </a>
                </div>

                <input type="hidden" id="csrfToken" value="{{csrfToken}}">
                <p id="landMessage" class="text-sm text-slate-600" role="status" aria-live="polite">Memuat daftar lahan…</p>
                <div id="landList" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
            </main>
        </div>
    </div>
    <script>
        const landList = document.querySelector('#landList');
        const landMessage = document.querySelector('#landMessage');
        const csrfToken = document.querySelector('#csrfToken').value;
        const soilLabels = {
            alluvial: 'Tanah Aluvial',
            volcanic: 'Tanah Vulkanik',
            humus: 'Tanah Humus / Gambut',
            latosol: 'Tanah Latosol'
        };

        async function loadLands() {
            landMessage.textContent = 'Memuat daftar lahan…';
            try {
                const response = await fetch('/api/farmer/lands');
                if (!response.ok) throw new Error('Daftar lahan tidak dapat dimuat.');
                const { lands } = await response.json();
                landList.replaceChildren();

                if (lands.length === 0) {
                    landMessage.textContent = 'Belum ada lahan. Gunakan tombol “Tambah Lahan” untuk mencatat lahan pertama.';
                    return;
                }

                landMessage.textContent = `${lands.length} lahan terdaftar.`;
                for (const land of lands) {
                    const card = document.createElement('article');
                    card.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3';

                    const heading = document.createElement('div');
                    heading.className = 'flex items-start justify-between gap-3';
                    const title = document.createElement('h3');
                    title.className = 'text-lg font-bold text-slate-900';
                    title.textContent = land.name;
                    const area = document.createElement('span');
                    area.className = 'shrink-0 rounded-full bg-emerald-50 px-3 py-1 text-sm font-semibold text-emerald-700';
                    area.textContent = `${land.area_hectares} ha`;
                    heading.append(title, area);
                    card.append(heading);

                    const details = document.createElement('p');
                    details.className = 'text-sm text-slate-600';
                    details.textContent = [
                        soilLabels[land.soil_type] || 'Jenis tanah belum diisi',
                        land.commodity ? `Komoditas: ${land.commodity}` : '',
                        land.coordinates ? `Koordinat: ${land.coordinates}` : ''
                    ].filter(Boolean).join(' • ');
                    card.append(details);

                    if (land.notes) {
                        const notes = document.createElement('p');
                        notes.className = 'text-sm text-slate-500 whitespace-pre-wrap';
                        notes.textContent = land.notes;
                        card.append(notes);
                    }

                    const actions = document.createElement('div');
                    actions.className = 'flex items-center justify-end gap-2 border-t border-slate-100 pt-3';
                    const editLink = document.createElement('a');
                    editLink.href = `/farmer/lands/${encodeURIComponent(land.id)}/edit`;
                    editLink.className = 'rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50';
                    editLink.textContent = 'Ubah';
                    const deleteButton = document.createElement('button');
                    deleteButton.type = 'button';
                    deleteButton.className = 'rounded-lg bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-700';
                    deleteButton.textContent = 'Hapus';
                    deleteButton.addEventListener('click', async () => {
                        if (!window.confirm(`Hapus lahan “${land.name}”?`)) return;
                        const body = new URLSearchParams({ _csrf: csrfToken });
                        try {
                            const result = await fetch(`/farmer/lands/${encodeURIComponent(land.id)}/delete`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                body
                            });
                            if (!result.ok) throw new Error('Lahan tidak dapat dihapus.');
                            await loadLands();
                        } catch (error) {
                            landMessage.textContent = error.message;
                        }
                    });
                    actions.append(editLink, deleteButton);
                    card.append(actions);
                    landList.append(card);
                }
            } catch (error) {
                landMessage.textContent = error.message;
            }
        }

        document.querySelector('#menuToggle').addEventListener('click', () => {
            document.querySelector('#sidebar').classList.toggle('-translate-x-full');
            document.querySelector('#sidebarOverlay').classList.toggle('hidden');
        });
        document.querySelector('#sidebarOverlay').addEventListener('click', () => {
            document.querySelector('#sidebar').classList.toggle('-translate-x-full');
            document.querySelector('#sidebarOverlay').classList.toggle('hidden');
        });

        loadLands();
    </script>
</body>
</html>
